<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Clapper / Video Screen Card -->
  <g filter="url(#glow)">
    <rect x="80" y="90" width="352" height="240" rx="28" fill="#1e293b" stroke="url(#accent)" stroke-width="4" />
    
    <!-- Video Screen Play Triangle -->
    <polygon points="230,170 310,210 230,250" fill="url(#accent)" />
    
    <!-- Top Clapper Bars -->
    <path d="M80 140 L432 140" stroke="#334155" stroke-width="3" />
    <path d="M140 90 L165 140 M220 90 L245 140 M300 90 L325 140 M380 90 L405 140" stroke="#64748b" stroke-width="4" />
  </g>

  <!-- Star Rating Badge Overlay in Bottom Right -->
  <g filter="url(#glow)">
    <circle cx="360" cy="350" r="75" fill="#0f172a" stroke="url(#gold)" stroke-width="6" />
    <!-- 5-Point Star -->
    <polygon points="360,295 377,333 418,336 387,364 396,405 360,383 324,405 333,364 302,336 343,333" fill="url(#gold)" />
  </g>

  <!-- Artist Mask Icon Overlay in Bottom Left -->
  <g filter="url(#glow)">
    <circle cx="150" cy="350" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <!-- Mask shape -->
    <path d="M125 335 C125 320 175 320 175 335 C175 365 150 375 150 375 C150 375 125 365 125 335 Z" fill="#0284c7" />
    <circle cx="138" cy="336" r="4" fill="#0f172a" />
    <circle cx="162" cy="336" r="4" fill="#0f172a" />
    <path d="M142 355 Q150 362 158 355" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
